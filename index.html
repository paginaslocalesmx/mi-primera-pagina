<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Negocio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
        }

        h1 {
            color: #c0392b;
            text-align: center;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .boton {
            display: inline-block;
            background-color: #c0392b;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Tortillería Don Pepe</h1>

        <p>
            Somos una tortillería tradicional que ofrece tortillas
            recién hechas todos los días, con calidad y buen precio.
        </p>

        <p>
            📍 Servicio en la colonia<br>
            📞 Atención rápida por WhatsApp
        </p>

        <a class="boton" href="#">Contáctanos</a>

    </div>

</body>
</html>
